<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微觉 AI | 资产炼金炉 V8.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --amber: #D4A373; --bg: #FFFBF5; --ink: #433422; --leaf: #4ade80; }
        body { background: var(--bg); color: var(--ink); font-family: 'Noto Sans SC', sans-serif; cursor: none; overflow-x: hidden; }
        .serif { font-family: 'Noto Serif SC', serif; }
        #cursor { position: fixed; width: 10px; height: 10px; background: var(--amber); border-radius: 50%; pointer-events: none; z-index: 10001; transform: translate(-50%, -50%); transition: transform 0.1s ease-out; }
        
        .glass { background: rgba(255,255,255,0.96); backdrop-filter: blur(25px); border-radius: 32px; border: 1px solid rgba(212,163,115,0.1); }
        .lang-switcher { background: #E5E7EB; border-radius: 999px; padding: 3px; display: inline-flex; gap: 2px; }
        .lang-btn { padding: 4px 12px; border-radius: 999px; font-size: 10px; font-weight: bold; transition: 0.3s; color: #9CA3AF; }
        .lang-btn.active { background: var(--amber); color: white; }

        /* 弹窗遮罩 */
        .overlay { position: fixed; inset: 0; background: rgba(67, 52, 34, 0.1); backdrop-filter: blur(15px); z-index: 10000; display: none; align-items: center; justify-content: center; }
        .quiz-card { padding: 20px; background: #FAFAFA; border-radius: 20px; border: 1px solid #F0F0F0; margin-bottom: 1.2rem; }
        .quiz-btn { padding: 12px; font-size: 11px; background: white; border-radius: 12px; border: 1px solid #E5E7EB; transition: 0.3s; font-weight: bold; }
        .quiz-btn.selected { background: var(--amber) !important; color: white !important; border-color: var(--amber) !important; }

        /* 报告板块样式 */
        .section-label { font-size: 11px; font-weight: bold; color: var(--amber); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .section-label::before { content: "I"; color: var(--amber); font-weight: 900; }
        .action-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 16px; padding: 20px; margin: 15px 0; }
        .recovery-box { border-left: 2px solid var(--amber); padding-left: 15px; margin-top: 20px; }
        
        .btn-main { background: var(--amber); color: white; border-radius: 99px; transition: 0.4s; font-weight: bold; box-shadow: 0 4px 12px rgba(212,163,115,0.1); }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(212,163,115,0.2); }
        
        .matrix-bar { height: 100%; transition: 1.5s; background: linear-gradient(90deg, #fecaca, #A5D8E1, #bbf7d0); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--amber); border-radius: 10px; }
    </style>
</head>
<body class="p-6 md:p-10">
    <div id="cursor"></div>

    <div id="quizModal" class="overlay" style="display: flex;">
        <div class="glass p-10 max-w-2xl w-full max-h-[85vh] flex flex-col relative animate-in fade-in zoom-in duration-300">
            <div class="absolute top-6 right-10 lang-switcher">
                <button onclick="setLang('zh')" class="lang-btn active" id="qZh">中</button>
                <button onclick="setLang('en')" class="lang-btn" id="qEn">EN</button>
            </div>
            <h2 class="serif text-3xl mb-1 text-[--amber] text-center" id="qTitle">生命资产初始审计</h2>
            <p class="text-[9px] opacity-40 tracking-[3px] mb-8 text-center uppercase">Biological Asset Evaluation</p>
            <div id="quizList" class="overflow-y-auto pr-3 mb-6 custom-scroll flex-grow"></div>
            <button onclick="closeModal('quizModal')" class="btn-main w-full py-5 text-lg" id="btnFinish">签署资产维保协议</button>
        </div>
    </div>

    <div id="historyModal" class="overlay">
        <div class="glass p-10 max-w-2xl w-full max-h-[80vh] flex flex-col relative">
            <button onclick="closeModal('historyModal')" class="absolute top-6 right-8 text-[10px] opacity-50 font-bold">CLOSE [X]</button>
            <h2 class="serif text-2xl mb-8 text-[--amber]">资产炼金日志 (History)</h2>
            <div id="historyList" class="overflow-y-auto pr-3 custom-scroll space-y-4">
                <div class="p-10 text-center opacity-20 italic">暂无炼金记录...</div>
            </div>
        </div>
    </div>

    <header class="max-w-7xl mx-auto mb-12 flex justify-between items-end">
        <div>
            <h1 class="serif text-4xl font-bold text-[--amber]">微觉 AI</h1>
            <p class="text-[9px] opacity-40 serif mt-1 uppercase tracking-[4px]">Microsense Alchemy Lab</p>
        </div>
        <div class="flex items-center gap-8">
            <div class="lang-switcher">
                <button onclick="setLang('zh')" class="lang-btn active" id="mZh">中</button>
                <button onclick="setLang('en')" class="lang-btn" id="mEn">EN</button>
            </div>
            <div class="text-right">
                <p class="text-[9px] opacity-30 uppercase" id="wealthLabel">预计单次增值潜力</p>
                <p class="text-3xl font-bold text-green-500 serif">+ ¥ <span id="wealth">12,850</span></p>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-10">
        <div class="lg:col-span-4 space-y-8">
            <div class="glass p-8">
                <h3 class="serif text-lg font-bold mb-6 flex items-center">🧘 <span class="ml-2" id="inputLabel">微觉录入</span></h3>
                <textarea id="uIn" class="w-full bg-transparent border-none outline-none text-base serif min-h-[160px] resize-none leading-relaxed" placeholder="描述你当下的体感或情绪..."></textarea>
                <button onclick="refine()" class="btn-main w-full py-4 mt-6 text-base" id="btnRefine">炼化并提升资产</button>
            </div>
            <div class="glass p-8">
                <h3 class="serif text-lg mb-6" id="matrixLabel">生命五维能量</h3>
                <div id="bars" class="space-y-5"></div>
            </div>
        </div>

        <div class="lg:col-span-8">
            <div class="glass p-10 h-full flex flex-col min-h-[650px]">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="serif text-2xl text-[--amber]" id="reportLabel">资产炼金炉</h3>
                    <button onclick="openHistory()" class="text-[9px] border border-gray-200 rounded-full px-4 py-1.5 tracking-widest hover:bg-[--amber] hover:text-white transition-all uppercase">History</button>
                </div>
                <div id="out" class="flex-grow overflow-y-auto pr-2 custom-scroll">
                    <div class="h-full flex flex-col items-center justify-center text-[--amber]/20 italic serif text-base text-center" id="emptyMsg">
                        🕯️ 每一个微小的体感，都是身体在试图与你对话。
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let lang = 'zh', scores = [65, 82, 75, 90, 68];
        const alchemyHistory = [];

        const quizDB = {
            zh: {
                title: "生命资产初始审计", button: "签署资产维保协议",
                questions: [
                    { q: "1. 晨起神志感", opts: ["透支/低", "平衡/中", "盈余/高"] },
                    { q: "2. 睡眠深度稳定性", opts: ["容易惊醒", "偶尔梦多", "一觉天亮"] },
                    { q: "3. 脊柱灵活度", opts: ["很僵硬", "勉强触地", "轻松反折"] },
                    { q: "4. 颈椎旋转是否有“咔咔”声？", opts: ["僵硬如铁", "有点紧", "灵活自如"] },
                    { q: "5. 吃完饭，肚子会感觉闷闷的吗？", opts: ["胀气难受", "有点堵", "消化很快"] },
                    { q: "6. 手脚通常是温暖的吗？", opts: ["冰凉如雪", "温凉参半", "暖和红润"] },
                    { q: "7. 午后是否有明显的精力断崖？", opts: ["低/差", "平/中", "优/好"] },
                    { q: "8. 遇到突发急事会手忙脚乱吗？", opts: ["容易焦虑", "有点紧张", "沉着冷静"] },
                    { q: "9. 照镜子觉得自己脸色暗沉吗？", opts: ["没精打采", "气色一般", "神采奕奕"] },
                    { q: "10. 运动或熬夜后第二天缓得过来吗？", opts: ["连累几天", "睡一觉好", "很快恢复"] }
                ]
            },
            en: {
                title: "Asset Audit", button: "Sign Agreement",
                questions: [
                    { q: "1. Morning wakefulness", opts: ["Depleted", "Balanced", "Vitalized"] },
                    { q: "2. Sleep Stability", opts: ["Light", "Average", "Deep"] },
                    { q: "3. Spine Flexibility", opts: ["Stiff", "Average", "Flexible"] },
                    { q: "4. Neck 'cracking'?", opts: ["Stiff as Iron", "A bit tight", "Smooth"] },
                    { q: "5. Bloated after meals?", opts: ["Bloated", "Sluggish", "Fast"] },
                    { q: "6. Hands/feet warm?", opts: ["Cold as Snow", "Varies", "Warm"] },
                    { q: "7. Afternoon energy crash?", opts: ["Severe", "Stable", "High"] },
                    { q: "8. Stress reaction?", opts: ["Anxious", "Tense", "Calm"] },
                    { q: "9. Skin radiance?", opts: ["Dull", "Average", "Glowing"] },
                    { q: "10. Recovery speed?", opts: ["Days", "One sleep", "Quick"] }
                ]
            }
        };

        function setLang(l) {
            lang = l;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('q' + (l==='zh'?'Zh':'En')).classList.add('active');
            document.getElementById('m' + (l==='zh'?'Zh':'En')).classList.add('active');
            updateUI();
        }

        function updateUI() {
            const s = {
                zh: { input: "微觉录入", matrix: "生命五维能量", report: "资产炼金炉", refine: "炼化并提升资产", wealth: "预计单次增值潜力", empty: "🕯️ 每一个微小的体感，都是身体在试图与你对话。", placeholder: "例如：熬夜后眼睛干、肩膀沉、心里燥..." },
                en: { input: "Signal Capture", matrix: "5D Vitality", report: "Alchemy Lab", refine: "Start Alchemy", wealth: "Potential Gain", empty: "🕯️ Listening to somatic whispers...", placeholder: "Describe signals..." }
            }[lang];
            
            document.getElementById('qTitle').innerText = quizDB[lang].title;
            document.getElementById('btnFinish').innerText = quizDB[lang].button;
            document.getElementById('inputLabel').innerText = s.input;
            document.getElementById('matrixLabel').innerText = s.matrix;
            document.getElementById('reportLabel').innerText = s.report;
            document.getElementById('btnRefine').innerText = s.refine;
            document.getElementById('wealthLabel').innerText = s.wealth;
            document.getElementById('uIn').placeholder = s.placeholder;
            document.getElementById('emptyMsg').innerText = s.empty;

            const list = document.getElementById('quizList');
            list.innerHTML = quizDB[lang].questions.map((q, i) => `
                <div class="quiz-card">
                    <p class="text-[11px] font-bold mb-4 opacity-70">${q.q}</p>
                    <div class="grid grid-cols-3 gap-3">
                        ${q.opts.map(opt => `<button onclick="selectOpt(this)" class="quiz-btn">${opt}</button>`).join('')}
                    </div>
                </div>`).join('');

            const bc = document.getElementById('bars'); bc.innerHTML = '';
            const labels = lang === 'zh' ? ["气血净值", "心神带宽", "专注算力", "架构柔韧", "代谢效率"] : ["Vitality", "Emotion", "Focus", "Flexibility", "Metabolism"];
            labels.forEach((l, i) => {
                bc.innerHTML += `<div class="mb-4"><div class='flex justify-between text-[10px] font-bold mb-1.5 opacity-50 uppercase'><span>${l}</span><span>${scores[i]}%</span></div><div class='h-[4px] bg-gray-100 rounded-full overflow-hidden'><div class='matrix-bar' style="width:${scores[i]}%"></div></div></div>`;
            });
        }

        function selectOpt(btn) {
            btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            modal.style.opacity = '0';
            setTimeout(() => modal.style.display = 'none', 300);
        }

        function openHistory() {
            const modal = document.getElementById('historyModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.style.opacity = '1', 10);
            const list = document.getElementById('historyList');
            if(alchemyHistory.length > 0) {
                list.innerHTML = alchemyHistory.map(item => `
                    <div class="p-6 glass border border-amber/10 mb-4 animate-in slide-in-from-left-2">
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-[10px] bg-amber text-white px-2 py-0.5 rounded-full font-bold">LOG</span>
                            <span class="text-[10px] opacity-30 font-mono">${item.time}</span>
                        </div>
                        <div class="font-bold text-slate-800 text-sm mb-1">${item.title}</div>
                        <div class="text-[11px] opacity-50 italic">录入内容：${item.input}</div>
                    </div>
                `).join('');
            }
        }

        function refine() {
            const out = document.getElementById('out');
            const uInput = document.getElementById('uIn').value || "日常巡检";
            out.innerHTML = `<div class="h-full flex items-center justify-center animate-pulse text-[--amber] serif">正在进行资产辨证分析...</div>`;
            
            setTimeout(() => {
                const reportHTML = `
                <div class="animate-in slide-in-from-bottom-5 duration-500">
                    <div class="flex items-center gap-3 mb-6">
                        <span class="text-xl">✨</span>
                        <h4 class="serif text-xl font-bold text-slate-800">资产预警：胆经压力泄露</h4>
                        <div class="ml-auto flex gap-2">
                            <span class="text-[8px] px-2 py-0.5 bg-slate-100 border border-slate-200 rounded">#止损修复</span>
                            <span class="text-[8px] px-2 py-0.5 bg-slate-100 border border-slate-200 rounded">#压强平衡</span>
                        </div>
                    </div>
                    <div class="space-y-8">
                        <div><span class="section-label">【感知解析】</span><p class="text-sm text-slate-600 serif pl-3 leading-relaxed">监测到头部信号异常。由于长期精神过载，胆经排压通道受阻，导致资产遭遇“空转消耗”。</p></div>
                        <div><span class="section-label">【问题定位】</span><p class="text-sm text-slate-600 serif pl-3 font-bold">大脑带宽透支，“物理排压阀”临时失效。</p></div>
                        
                        <div class="action-box">
                            <div class="flex items-center gap-2 mb-2 text-green-700 font-bold text-[10px]">🔥 即刻增值操作 (IMMEDIATE ACTION)</div>
                            <p class="text-sm font-bold text-green-800 pl-1 leading-relaxed">
                                1. 敲击大腿外侧（风市穴）50次。 <br>
                                2. 配合“嘘”字呼吸法，想象浊气下行至脚底。 <br>
                                3. <strong class="text-amber">食补即刻建议：</strong> 温服一杯“陈皮生姜茶”，驱散中焦寒湿，助力排压。
                            </p>
                        </div>

                        <div class="recovery-box">
                            <span class="section-label">【资产回购建议】(RECOVERY PLAN)</span>
                            <div class="text-sm text-slate-600 serif pl-3 space-y-3 mt-2">
                                <p><strong class="text-amber">● 饮食回购：</strong> 晚饭禁忌生冷辛辣。推荐：<span class="underline decoration-amber/30">石斛麦冬泡水</span>（滋阴润燥）或少量桑葚。晚饭建议加一份黑豆，补足底层肾水。</p>
                                <p><strong class="text-amber">● 行为回购：</strong> 今晚11点前务必进入休眠状态。睡眠是生命资产唯一的自动增值窗口，觉察即是修复的开始。</p>
                            </div>
                        </div>
                    </div>
                </div>`;
                out.innerHTML = reportHTML;
                
                // 存入历史记录
                alchemyHistory.unshift({
                    time: new Date().toLocaleTimeString(),
                    title: "资产预警：胆经压力泄露",
                    input: uInput
                });
            }, 800);
        }

        document.addEventListener('mousemove', e => {
            const c = document.getElementById('cursor');
            c.style.left = e.clientX + 'px'; c.style.top = e.clientY + 'px';
        });

        window.onload = updateUI;
    </script>
</body>
</html>
